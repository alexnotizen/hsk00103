<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 3 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:32px; font-weight: bold;}
.progress{text-align:center;font-size:18px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:592px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

/* Pinyin mặt trước: căn giữa */
.pinyin{
  font-size:1.4em;
  color:#666666;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 1.8em; font-weight: bold; margin-bottom: 6px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

/* Mặt sau */
.zh-back { color: #2563eb; font-weight: bold; font-size: 1.5em; line-height: 1.2; display: inline-block; margin-top: 10px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.2em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.2em; color: #333; display: block; margin-bottom: 12px; }

.desc-front { font-size: 1.38em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.45; }
.desc{font-size: 1.56em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.45;}

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:22px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 3 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

<script>
const cards = [
  // THẺ 1: TÔI LÀ HỌC SINH
  {
    f: "<div style='text-align:center; width:100%; font-size:1.5em; font-weight:bold; margin-bottom:5px;'>TÔI LÀ HỌC SINH</div>" +
       "<div class='zh-front'>我<span class='hl-blue'>是</span>学生<br>我<span class='hl-blue'>不是</span>法国人</div>" +
       "<div class='pinyin'>Wǒ shì xuésheng / Wǒ bù shì Fǎguórén</div>" +
       "<div class='desc-front'>" +
       "<b><span class='hl-red'>A 是 B</span></b> (A là B — A, B là ai hoặc cái gì)<br>" +
       "<b><span class='hl-red'>A 不是 B</span></b> (A không phải là B)" +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>我老师不是法国人。</span><br><span class='pinyin-back'>Wǒ lǎoshī bù shì Fǎguórén.</span><span class='vi-back'>(Giáo viên của tôi không phải là người Pháp.)</span>" +
       "<span class='zh-back'>我是中国人。</span><br><span class='pinyin-back'>Wǒ shì Zhōngguórén.</span><span class='vi-back'>(Tôi là người Trung Quốc.)</span>" +
       "<span class='zh-back'>她是中文老师。</span><br><span class='pinyin-back'>Tā shì zhōngwén lǎoshī.</span><span class='vi-back'>(Cô ấy là giáo viên tiếng Trung.)</span>" +
       "</div>"
  },

  // THẺ 2: TÊN CỦA TÔI
  {
    f: "<div style='text-align:center; width:100%; font-size:1.5em; font-weight:bold; margin-bottom:5px;'>TÊN CỦA TÔI</div>" +
       "<div class='zh-front'>我<span class='hl-blue'>的</span>名字</div>" +
       "<div class='pinyin'>wǒ de míngzi</div>" +
       "<div class='desc-front'>" +
       "<b><span class='hl-red'>A 的 B</span></b> (B của A)<br>" +
       "Có thể bỏ 的 khi A là đại từ nhân xưng và B chỉ người/tổ chức/đơn vị." +
       "</div>",
    b: "<div class='desc' style='line-height:1.4;'>" +
       "<span class='zh-back'>我妈妈</span><br><span class='pinyin-back'>wǒ māma</span><span class='vi-back'>(Mẹ tôi)</span>" +
       "<span class='zh-back'>白家月的中文老师</span><br><span class='pinyin-back'>Bái Jiāyuè de zhōngwén lǎoshī</span><span class='vi-back'>(Giáo viên tiếng Trung của Bạch Gia Nguyệt)</span>" +
       "<span class='zh-back'>你的名字</span><br><span class='pinyin-back'>nǐ de míngzi</span><span class='vi-back'>(Tên của bạn)</span>" +
       "<span class='zh-back'>我老师 / 你学生 / 他同学</span><br><span class='pinyin-back'>wǒ lǎoshī / nǐ xuésheng / tā tóngxué</span><span class='vi-back'>(Thầy giáo tôi / Học sinh của bạn / Bạn cùng lớp của nó)</span>" +
       "</div>"
  },

  // THẺ 3: CÓ PHẢI KHÔNG? ĐÚNG KHÔNG?
  {
    f: "<div style='text-align:center; width:100%; font-size:1.5em; font-weight:bold; margin-bottom:5px;'>CÓ PHẢI KHÔNG? ĐÚNG KHÔNG?</div>" +
       "<div class='zh-front'>…<span class='hl-blue'>吗</span>?</div>" +
       "<div class='pinyin'>... ma?</div>" +
       "<div class='desc-front' style='font-size: 1.38em;'>" +
       "Trợ từ nghi vấn <span class='hl-red'>吗</span> đặt ở cuối câu trần thuật để biến câu đó thành câu hỏi." +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>你也很忙吗？</span><br><span class='pinyin-back'>Nǐ yě hěn máng ma?</span><span class='vi-back'>(Bạn cũng bận à?)</span>" +
       "<span class='zh-back'>你是他的中文老师吗？</span><br><span class='pinyin-back'>Nǐ shì tā de zhōngwén lǎoshī ma?</span><span class='vi-back'>(Cô là giáo viên tiếng Trung của cậu ấy à?)</span>" +
       "<span class='zh-back'>你有姐姐吗？</span><br><span class='pinyin-back'>Nǐ yǒu jiějie ma?</span><span class='vi-back'>(Bạn có chị gái không?)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
